name: BOBBY Android Build

on:
  push:
    branches: [bobby-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bobby-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      BOBBY_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare public APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BOBBY.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobby-debug-apk
          path: BOBBY.apk
          if-no-files-found: error
      - name: Publish public APK release
        if: github.ref == 'refs/heads/bobby-development'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bobby-public
          target_commitish: bobby-development
          name: BOBBY Android APK
          body: |
            Public Android APK build from bobby-development.
            Version code: ${{ github.run_number }}

            Direct download: https://github.com/di999666blo-ai/JERVIS_AI/releases/latest/download/BOBBY.apk

            IMPORTANT: This workflow currently uses the GitHub runner debug signing key. Android updates over an existing installation require a persistent signing key. Configure a stable Android signing keystore before distributing upgrades.
          files: BOBBY.apk
          overwrite_files: true
          make_latest: true
