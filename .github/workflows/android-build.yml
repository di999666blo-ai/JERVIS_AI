name: BOBBY Android Build

on:
  push:
    branches: [bobby-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bobby-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      BOBBY_VERSION_CODE: ${{ github.run_number }}
      BOBBY_SIGNING_ENABLED: ${{ secrets.BOBBY_KEYSTORE_BASE64 != '' && secrets.BOBBY_KEYSTORE_PASSWORD != '' && secrets.BOBBY_KEY_ALIAS != '' && secrets.BOBBY_KEY_PASSWORD != '' }}
      BOBBY_SIGNING_ANY_PRESENT: ${{ secrets.BOBBY_KEYSTORE_BASE64 != '' || secrets.BOBBY_KEYSTORE_PASSWORD != '' || secrets.BOBBY_KEY_ALIAS != '' || secrets.BOBBY_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate signing secrets
        if: ${{ env.BOBBY_SIGNING_ANY_PRESENT == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BOBBY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOBBY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOBBY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOBBY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing BOBBY_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing BOBBY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BOBBY_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BOBBY_KEY_PASSWORD"; exit 1; }
      - name: Configure persistent signing key (optional but required for in-place upgrades)
        if: ${{ env.BOBBY_SIGNING_ENABLED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BOBBY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOBBY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOBBY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOBBY_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bobby-release.jks"
          echo "BOBBY_KEYSTORE_PATH=$RUNNER_TEMP/bobby-release.jks" >> "$GITHUB_ENV"
          echo "BOBBY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BOBBY_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BOBBY_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare public APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BOBBY.apk
      - name: Generate APK SHA-256 checksum
        run: sha256sum BOBBY.apk > BOBBY.apk.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobby-debug-apk
          path: |
            BOBBY.apk
            BOBBY.apk.sha256
          if-no-files-found: error
      - name: Publish public APK release
        if: github.ref == 'refs/heads/bobby-development' && env.BOBBY_SIGNING_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bobby-public
          target_commitish: bobby-development
          name: BOBBY Android APK
          body: |
            Stable signed Android APK build from bobby-development.
            Version code: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Direct download: https://github.com/di999666blo-ai/JERVIS_AI/releases/latest/download/BOBBY.apk
          files: |
            BOBBY.apk
            BOBBY.apk.sha256
          overwrite_files: true
          make_latest: true
